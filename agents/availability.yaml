schema_version: 1
active_environment: "windows-cursor"

environments:
  windows-cursor:
    description: "Windows Codex environment with Cursor Agent available"
    agents:
      cursor:
        available: true
        capabilities:
          - review
          - advisor
          - delegate
        model: "cursor-grok-4.6-high"
        preflight:
          status:
            - "cursor-agent.cmd"
            - "status"
          login:
            - "cursor-agent.cmd"
            - "login"
        review:
          command: "cursor-agent.cmd"
          args:
            - "-p"
            - "--mode=ask"
            - "--sandbox"
            - "disabled"
            - "--model"
            - "{model}"
            - "--output-format"
            - "text"
            - "--workspace"
            - "{workspace}"
            - "{prompt}"
        advisor:
          command: "cursor-grok-advisor.cmd"
        delegate:
          command: "cursor-grok-delegate.cmd"

      codex-sol:
        available: true
        capabilities:
          - review
        model: "gpt-5.6-sol"
        review:
          command: "codex.exe"
          args:
            - "exec"
            - "--config"
            - "model_reasoning_effort=\"high\""
            - "--model"
            - "{model}"
            - "--sandbox"
            - "read-only"
            - "--cd"
            - "{workspace}"
            - "--ephemeral"
            - "{prompt}"

      agy:
        available: false
        capabilities:
          - review
        reason: "AGY is not installed or authenticated in this environment."
        review:
          command: "agy"
